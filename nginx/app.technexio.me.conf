# ==============================================================================
# Nginx Configuration for Nexio Platform
# Domain: app.technexio.me
# Target Container: http://127.0.0.1:3010
# ==============================================================================

# Map connection upgrade for WebSocket support (realtime Yjs sync and Socket.IO)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ------------------------------------------------------------------------------
# 1. HTTP Server - Redirect all HTTP traffic to HTTPS (Port 80 -> 443)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name app.technexio.me;

    # Let's Encrypt ACME challenge location for Certbot verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all other HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server - Secure Reverse Proxy with WebSockets and Streaming
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.technexio.me;

    # SSL Certificates (managed by Certbot / Let's Encrypt)
    # If running Certbot for the first time:
    # sudo certbot --nginx -d app.technexio.me
    ssl_certificate /etc/letsencrypt/live/app.technexio.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.technexio.me/privkey.pem;

    # Modern TLS Security Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Maximum file upload size (allows large attachments, PDF, video, and doc blobs)
    client_max_body_size 100M;
    client_body_buffer_size 16M;

    # --------------------------------------------------------------------------
    # Main Application & API Reverse Proxy
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3010;

        # HTTP/1.1 is required for WebSocket and persistent connections
        proxy_http_version 1.1;

        # WebSocket headers for real-time collaboration (/sync) & Socket.IO
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Host & Client IP Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Long timeouts for persistent WebSockets and AI Copilot streaming (SSE)
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        # Disable buffering to allow instant streaming for real-time sync & AI
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }
}
