name: Auto PR on Version Bump

on:
  push:
    branches:
      - candly
      - main
    paths:
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from package.json
        id: package_version
        run: |
          VERSION=$(jq -r .version package.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Package version: $VERSION"

      - name: Get latest Git tag
        id: latest_tag
        run: |
          # Retrieve the latest semver tag (ignoring ^{} dereferenced tags)
          LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n1)
          CLEAN_TAG="${LATEST_TAG#v}"
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV
          echo "CLEAN_TAG=$CLEAN_TAG" >> $GITHUB_ENV
          echo "Latest tag: $LATEST_TAG (clean: $CLEAN_TAG)"

      - name: Check if PR already exists
        id: check_pr
        run: |
          # Set base branch (target to merge into) and head branch (source branch)
          BASE_BRANCH="main"
          HEAD_BRANCH="${{ github.ref_name }}"

          if [ "$HEAD_BRANCH" = "$BASE_BRANCH" ]; then
            echo "Head branch is the same as base branch ($BASE_BRANCH). Skipping PR check."
            echo "PR_EXISTS=1" >> $GITHUB_ENV
          else
            PR_EXISTS=$(gh pr list --state open --base "$BASE_BRANCH" --head "$HEAD_BRANCH" --json number --jq '. | length')
            echo "PR_EXISTS=$PR_EXISTS" >> $GITHUB_ENV
            echo "Existing open PRs: $PR_EXISTS"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create Pull Request
        if: env.VERSION != env.CLEAN_TAG && env.PR_EXISTS == '0'
        run: |
          BASE_BRANCH="main"
          HEAD_BRANCH="${{ github.ref_name }}"

          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$HEAD_BRANCH" \
            --title "🚀 Release v${{ env.VERSION }}" \
            --body "### 🔍 Changes Include:
          - Automated version bump to \`${{ env.VERSION }}\`
          - Promotes changes from \`$HEAD_BRANCH\` to \`$BASE_BRANCH\`

          ### ✅ Pre-merge Checklist:
          - [ ] All tests passing
          - [ ] Documentation updated
          - [ ] Docker images built and tested

          > 🤖 *This PR was automatically generated by [GitHub Actions](https://github.com/actions)*" \
            --label "release,automated pr"
        env:
          GH_TOKEN: ${{ github.token }}

