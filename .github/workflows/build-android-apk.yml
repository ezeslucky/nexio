name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Nexio Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          corepack enable
          yarn install --network-timeout 600000

      - name: Build Web Application
        run: |
          node .yarn/releases/yarn-4.9.1.cjs nexio build -p web

      - name: Copy Web Dist to Android Assets
        run: |
          mkdir -p packages/frontend/apps/android/dist
          cp -r packages/frontend/apps/web/dist/* packages/frontend/apps/android/dist/

      - name: Sync Capacitor Android
        working-directory: packages/frontend/apps/android
        run: |
          npx cap sync android

      - name: Build Android APK
        working-directory: packages/frontend/apps/android/App
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexio-debug-apk
          path: packages/frontend/apps/android/App/app/build/outputs/apk/debug/*.apk

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/frontend/apps/android/App/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
