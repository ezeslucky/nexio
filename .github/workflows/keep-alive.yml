name: Keep Render App Alive 24/7

on:
  schedule:
    # Run every 10 minutes to prevent Render free instance from sleeping (Render sleeps after 15 min)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping app.technexio.me
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive HTTP ping
        run: |
          echo "Pinging https://app.technexio.me to keep Render container warm..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://app.technexio.me/ || echo "000")
          echo "Response code: $HTTP_CODE"
