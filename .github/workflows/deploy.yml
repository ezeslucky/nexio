name: Build and Auto-Deploy Nexio

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME || 'ezeslucky441' }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD || secrets.DOCKER_TOKEN || secrets.DOCKERHUB_PASSWORD }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        if: ${{ env.DOCKERHUB_TOKEN != '' }}
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ env.DOCKERHUB_TOKEN != '' }}
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/nexio:latest
            ${{ env.DOCKERHUB_USERNAME }}/nexio:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production Server
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ needs.build-and-push.result == 'success' }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME || 'ezeslucky441' }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL || secrets.RENDER_DEPLOY_HOOK }}

    steps:
      - name: SSH Remote Deploy
        if: ${{ env.SSH_HOST != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER || 'root' }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            echo "Pulling latest Nexio image..."
            docker pull ${{ env.DOCKERHUB_USERNAME }}/nexio:latest
            
            if [ -f "docker-compose.prod.yml" ]; then
              docker compose -f docker-compose.prod.yml up -d --force-recreate
            else
              docker stop nexio || true
              docker rm nexio || true
              docker run -d \
                --name nexio \
                --network nexio-net \
                --restart unless-stopped \
                -p 127.0.0.1:3010:3010 \
                -e NODE_ENV=production \
                -e NEXIO_SERVER_EXTERNAL_URL="https://app.technexio.me" \
                -e NEXIO_SERVER_HOST="app.technexio.me" \
                -e NEXIO_SERVER_HTTPS=true \
                -v nexio_pgdata:/var/lib/postgresql/data \
                ${{ env.DOCKERHUB_USERNAME }}/nexio:latest
            fi
            echo "Nexio deployed successfully!"

      - name: Trigger Render Deploy Webhook
        if: ${{ env.DEPLOY_WEBHOOK_URL != '' }}
        run: |
          echo "Triggering Render deploy webhook..."
          curl -f -X POST "${{ env.DEPLOY_WEBHOOK_URL }}" || curl -f "${{ env.DEPLOY_WEBHOOK_URL }}"
          echo "Render deploy webhook triggered successfully!"
