services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - "3010:3010"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: nexio
      POSTGRES_PASSWORD: nexio
      POSTGRES_DB: nexio
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"